name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate shell syntax
        run: bash -n roadmap-runner.sh skills/roadmap-runner/scripts/roadmap-runner.sh
      - name: Run offline fixtures only
        env:
          NO_LIVE_AI: '1'
        run: python3 -m unittest discover -s tests -v
