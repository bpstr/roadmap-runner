name: Offline shell tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test only the fake Codex executable
        run: bash tests/supervisor-test.sh
